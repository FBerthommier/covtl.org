# notebooklm-manifest.yaml - COVTL documentation corpus for NotebookLM
#
# NOTE: a JSON twin (notebooklm-manifest.json) sits next to this file —
# the Apps Script agent (docs/NotebookLM-AppsScript.gs) reads the JSON.
# When editing this YAML, regenerate/commit the JSON twin too.
#
# This file lives at the ROOT of the covtl.org site repository. It is the
# single machine-readable pointer list that a future GitHub -> Google
# Drive -> NotebookLM synchronization agent will read (see the gateway
# project brief; NOT implemented yet - this manifest only prepares it).
#
# Conventions:
#   - `id` is stable: never rename or reuse an id; new documents get new ids.
#   - `path` is the stable filename used in the Drive mirror folder
#     (NotebookLM-Corpus/), not a location in this repository.
#   - `repository` + `url` point at the authoritative document on GitHub
#     (raw URL, main branch). GitHub remains the source of truth.
#   - `excluded` lists documents intentionally NOT destined to NotebookLM.
#   - Licenses are per document; the COVTL documentation is CC BY-SA 4.0
#     (see LICENSE-DOCS.md in each repository). The COVTL chain is built
#     on VocalTractLab 2.4 by Peter Birkholz (vocaltractlab.de) - keep
#     this credit attached where it applies.

manifest_version: 1
site: https://covtl.org
notebook_url: ""   # reserved: public share link of the COVTL NotebookLM notebook (not created yet)
drive_folder: NotebookLM-Corpus/

documents:
  - id: manual_001
    path: covtl-reference-manual.pdf
    repository: FBerthommier/covtl-pipeline
    url: https://raw.githubusercontent.com/FBerthommier/covtl-pipeline/main/docs/covtl-reference-manual.pdf
    title: "COVTL reference manual - didactic synthesis of the documentation family (after Peter Birkholz / VocalTractLab 2.4)"
    category: manual
    format: pdf
    version: 1.0.0
    license: CC-BY-SA-4.0
    last_modified: 2026-11-19
    credit: "Built on VocalTractLab 2.4 by Peter Birkholz (vocaltractlab.de)"

  - id: manual_002
