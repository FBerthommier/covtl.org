# notebooklm-sync.yml - GitHub -> Google Drive -> NotebookLM gateway.
#
# Triggers:
#   - push touching notebooklm-manifest.yaml (the corpus changed);
#   - manual dispatch (dry_run input, default true);
#   - weekly schedule (backup option, dry-run to stay safe).
#
# Secrets (see docs/NOTEBOOKLM-SETUP.md):
#   GOOGLE_CREDENTIALS : service-account JSON (raw content), Drive API
#                        enabled, shared on the NotebookLM-Corpus folder
#                        with Editor right.
#   DRIVE_FOLDER_ID    : id of the NotebookLM-Corpus/ Drive folder.
# Without these secrets the agent falls back to dry-run mode (GitHub
# downloads + fingerprints + report, no Drive call) and still succeeds -
# the run summary states the mode explicitly.

name: notebooklm-sync

on:
  push:
    branches: [main]
    paths:
      - 'notebooklm-manifest.yaml'
      - 'scripts/notebooklm_sync.py'
      - '.github/workflows/notebooklm-sync.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (report only, no Drive write)'
        required: false
        default: 'true'
  schedule:
    - cron: "17 4 * * 1"   # weekly backup option - dry-run report

permissions:
  contents: read

jobs:
  sync:
    name: Mirror manifest to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        run: python -m pip install --upgrade pyyaml google-api-python-client

      - name: Run the sync agent
        id: sync
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--dry-run"
          fi
          python scripts/notebooklm_sync.py $ARGS \
            --report-file notebooklm-sync-report.json

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooklm-sync-report
          path: notebooklm-sync-report.json
          retention-days: 90
          if-no-files-found: error
